[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-core"
version = "0.1.0"
description = "Layer A: the robot as plain Python. No ROS imports, ever."
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    # Gemini TTS is called over plain REST from robot_core/speech.py, so
    # `requests` is the entire TTS dependency — no client library, no
    # espeak-ng apt package, no Nix TTS model directory.
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Kept optional so Layer A imports on a laptop with no audio hardware, which is
# what lets the tests run anywhere.
voice = [
    "google-genai>=1.0.0",
    "sounddevice>=0.4.6",
]
# The vision layer (robot_core/perception, robot_core/camera.py). picamera2
# itself comes from apt on the Pi (python3-picamera2), not pip — create the venv
# with --system-site-packages so it is visible.
vision = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]
# Pan/tilt servos on hardware PWM (needs dtoverlay=pwm-2chan).
gimbal = ["rpi-hardware-pwm>=0.2"]
dev = ["pytest>=7.0", "numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
robot-run = "robot_core.run:main"

[tool.setuptools.packages.find]
include = ["robot_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
