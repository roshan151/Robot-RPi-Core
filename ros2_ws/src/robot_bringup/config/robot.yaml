# Everything you actually tune. robot_core/settings.py still holds the
# constants and their environment-variable fallbacks, so Layer A runs
# standalone; this file is what the ROS graph uses and what you edit.
#
# The calibration pair can also be changed live, which is the point:
#   ros2 param set /drivetrain ticks_per_cm 103.4
# It is refused while a move is running, because rescaling the tick target of a
# move already in flight would silently change how far it goes.

/drivetrain:
  ros__parameters:
    # Set this to whatever the Arduino enumerates as. Write a udev rule and use
    # a stable name (/dev/arduino) before you plug in a second USB serial
    # device — the numbering swaps on reboot and the robot will happily send
    # drive commands to the wrong one.
    serial_port: "/dev/ttyUSB0"
    baud: 115200

    # Calibration. Both scale the TARGET, not the measurement, so neither can
    # make a move stop early — short travel is traction or a lost encoder
    # channel, never calibration. See the calibration section of the README.
    ticks_per_cm: 100.0
    ticks_per_degree: 8.0

    # The hard limit on a single move. Enforced in the goal callback, so the
    # model cannot talk its way past it.
    max_drive_m: 5.0
    move_timeout_s: 20.0

    encoder_publish_hz: 10.0

/voice:
  ros__parameters:
    # Placeholder: the Live session still reads model, prompt and audio device
    # from robot_core/settings.py and the environment. Moving those here is a
    # later tidy-up, not a Phase 3 requirement.
    {}

# --- vision (VISION-DESIGN.md) ------------------------------------------------
# Defaults come from robot_core/settings.py (and so from the environment);
# anything set here wins under ROS.

/perception:
  ros__parameters:
    # The Mac mini. Left to VISION_SERVICE_BASE_URL in .env by default;
    # uncomment to pin it here. Find the address on the mini: ipconfig getifaddr en0
    # base_url: "http://192.168.1.50:8080"
    detect_hz: 2.0
    track_hz: 15.0
    detect_timeout_s: 0.6
    max_result_age_s: 1.0
    min_confidence: 0.4
    # Camera Module 3 standard ~66, Wide ~102. Every bearing depends on this.
    hfov_deg: 66.0
    camera_kind: "pi"          # pi | opencv | auto
    hflip: false
    vflip: false

/gimbal:
  ros__parameters:
    enabled: true              # false = no servos (bench), bearings assume straight ahead

/vision_behavior:
  ros__parameters:
    speed_pct: 0.0             # 0 = drivetrain default; lower it for gentler following
