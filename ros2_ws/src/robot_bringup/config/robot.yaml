# Everything you actually tune. robot_core/settings.py still holds the
# constants and their environment-variable fallbacks, so Layer A runs
# standalone; this file is what the ROS graph uses and what you edit.
#
# The calibration pair can also be changed live, which is the point:
#   ros2 param set /drivetrain ticks_per_cm 103.4
# It is refused while a move is running, because rescaling the tick target of a
# move already in flight would silently change how far it goes.

/drivetrain:
  ros__parameters:
    # Set this to whatever the Arduino enumerates as. Write a udev rule and use
    # a stable name (/dev/arduino) before you plug in a second USB serial
    # device — the numbering swaps on reboot and the robot will happily send
    # drive commands to the wrong one.
    serial_port: "/dev/ttyUSB0"
    baud: 115200

    # Calibration. Both scale the TARGET, not the measurement, so neither can
    # make a move stop early — short travel is traction or a lost encoder
    # channel, never calibration. See the calibration section of the README.
    ticks_per_cm: 38.5
    ticks_per_degree: 6

    # The hard limit on a single move. Enforced in the goal callback, so the
    # model cannot talk its way past it.
    max_drive_m: 5.0
    move_timeout_s: 20.0

    encoder_publish_hz: 10.0

    # Odometry (/odom, odom -> base_link, /motion_health). Needs firmware v5.
    # 0 derives the effective track width from ticks_per_cm and
    # ticks_per_degree — usually better than a tape measure, as it includes
    # wheel scrub. The firmware's LEFT channel drives the physical RIGHT wheel,
    # hence swap_sides; /motion_health says "wrong_direction" if that's wrong.
    wheelbase_m: 0.0
    odom_swap_sides: true
    # Brake as soon as motion health says stalled/slipping (and, with the IMU, tilted).
    stop_on_stuck: true

    # IMU: DFRobot Fermion 10 DOF (SEN0697, BMI323) on I2C. Wiring and checks: README, "IMU and ToF
    # sensors". With it the heading comes from the gyro, every turn is trimmed to the asked
    # angle, and tilting past the limits stops the move.
    imu_fitted: true           # set true once tests/hardware/check_imu.py reads sensible angles
    imu_bus: 1                 # I2C bus. 1 = GPIO2/3
    imu_gyro_addr: 105         # 0x69, the BMI323 with its address pad open (as shipped); 104 (0x68) if closed
    imu_axes: ["y", "x", "-z"]   # which board axis points robot-forward, robot-left, up; "-" flips one.
                               # As mounted: flat, chips UP, the printed Y arrow to the robot's FRONT and
                               # X to its LEFT (the printed Z points into the board, so up is -z).
                               # check_imu.py tells you if it is right
    turn_tolerance_deg: 2.0    # a turn further off than this (by the gyro) gets a short correcting move
    max_pitch_deg: 25.0        # MEASURE: nose up/down beyond this is "tilted" and stops the move
    max_roll_deg: 20.0
    max_dip_deg: 8.0           # the nose falling this far below where a drive started, fast, stops it at once
                               # (going over an edge the ToF missed). Raise it if a bumpy floor trips it

/voice:
  ros__parameters:

    # if true, Look for the Bluetooth buds and prefer them when their mic is up
    buds_check: false

    # if true, Gemini session resumption + context-window compression: the conversation carries
    live_resume: true

    # if true, gestures are not played: the OLED shows "Robot Gesture: <name>" instead,
    gesture_text_only: true

    # false = no spoken announcements ("Robot online", "Voice session failed"). With no
    # speaker fitted they only delay the microphone: ~6 s on every dropped session.
    tts: false

/explorer:
  ros__parameters:
    # Mac vision service. Empty = VISION_SERVICE_BASE_URL from /etc/robot.env.
    vision_url: "http://roshans-mac-mini.local:8080"

    # Maps are saved on the Mac under this name. To re-scan later on the same
    # map (growth tracking), set continue_map: true and start_pose to where the
    # robot is standing ON that map: [x, y, theta_rad] — read it off
    # http://<mac>:8080/v1/slam/map.png.
    map_name: "home"
    continue_map: false
    start_pose: [0.0, 0.0, 0.0]
    max_minutes: 60.0

    # Guard rails. Both are measured from start_pose: explore only within this
    # radius (metres; 0 = no limit), and with no_behind only ahead of the
    # start heading (the half-plane in front of where the robot begins).
    explore_radius_m: 10.0
    no_behind: false

    orbit_radius_m: 0.7        # photo distance from the plant
    orbit_views: 4             # full 360: 4 views, 90 degrees apart
    revisit_known: true        # photograph known plants again (a new visit)
    ask_before_drive: false    # image+text model checks each step (slow, thorough)

    # Head. Pan is limited to +-90 and tilt to +-45 in the driver, and both
    # park at their start position (the *_center_us pulse) on shutdown.
    tfluna_port: "/dev/serial0"
    tfluna_fitted: false        # false = TF-Luna removed (the ToF below replaces it)

    # 8x8 ToF: DFRobot Gravity SEN0628 on the head beside the camera, on I2C. Wiring and
    # checks: README, "IMU and ToF sensors". It is the range sensor for follow and explore and
    # sees the floor ahead (docs/TERRAIN-DESIGN.md). With tof_fitted and tfluna_fitted both
    # false, follow runs without a range and explore is refused.
    tof_fitted: true           # set true once tests/hardware/check_tof.py shows a sensible grid
    tof_port: ""               # "" = on I2C (what the robot uses), with tof_bus / tof_addr. For USB instead: the
                               # ToF's serial port, best its fixed name from `ls /dev/serial/by-id/`
    tof_bus: 1                 # I2C bus (1 = GPIO2/3, shared with the IMU); not used on USB
    tof_addr: 51               # 0x33, both address switches as shipped; not used on USB
    tof_tilt: 90               # board turned on its side: 90 = a quarter-turn clockwise seen from behind the head
                               # (its top edge to the robot's right), -90 = anticlockwise, 0 = upright. Multiples of 90
    tof_flip_rows: false       # true if check_tof.py shows the floor in the TOP rows
    tof_flip_cols: false       # true if a hand on the robot's left shows in the RIGHT columns
    tof_perpendicular: true    # ranges are distances to the sensor's face, not along each ray
                               # (check_tof.py against a flat wall says which)
    drive_tilt_deg: -30.0      # head tilt for looking at the floor ahead; follow glances here before a drive
    h_max_m: 0.03              # MEASURE (boards of 1 to 4 cm): the highest step the tracks climb
    min_landing_m: 0.20        # flat floor needed beyond a step for it to count as climbable
    max_drop_m: 0.03           # a fall deeper than this is a drop: never driven
    path_width_m: 0.30         # width of the strip of floor that is checked (the robot plus a margin)
    drive_on_unknown_floor: false   # false = never drive onto floor the ToF cannot read (very dark or shiny).
                               # Follow and explore then stop there; true drives it unchecked
    robot_height_m: 0.30       # MEASURE: the robot's height. Explore maps what is lower than this as in the way
    stop_short_m: 0.25         # a drive cut short by something (follow) ends with the middle of the tracks this
                               # far before it: half the track length (0.14 m) plus a gap. At least 0.25
    # Head camera: the USB U20CAM-1080P-WDR (PS5268, 1080p HDR) on the gimbal,
    # the only camera (docs/USB-CAMERA-MIC.md). Its built-in mic is the voice
    # fallback when the buds are off.
    camera_backend: "opencv"   # auto | picamera2 (ribbon) | opencv (USB)
    camera_index: 0            # USB camera: /dev/videoN (v4l2-ctl --list-devices)
    camera_main_size: [1920, 1080]   # explore photos
    face_camera_size: [1920, 1080]   # enroll / match / follow (was [640, 480] for the V2)
    camera_inverted: true      # mounted upside down: rotated 180 deg (ISP on the ribbon camera, software on USB)
    head_tilt_offset_deg: 21.0 # the head (camera and ToF) looks this far UP at tilt 0, its straight position
    head_height_m: 0.225        # MEASURE: ToF (and camera) height above the floor, head level
    pan_axis_x_m: 0.05         # MEASURE: pan axis ahead of the wheel-axle centre
    hfov_deg: 80.0             # USB HD: measured 2026-11-10 (1 m of tape = 764 px at 1.5 m). The lens bends
                               # (fisheye-like): ~105 at the edges, but the angle maths uses the centre. V2 was 66
    pwm_chip: 0                # Pi 4: 0. Pi 5: 2
    pan_channel: 1             # GPIO13
    tilt_channel: 0            # GPIO12
    pan_center_us: 1600.0      # measured (check_servo_pulse.py trim): head points straight ahead
    tilt_center_us: 1400.0     # measured (check_servo_pulse.py trim): head is level
    pan_us_per_deg: 11.111     # pulse change per degree (2000/180); MEASURE with tests/hardware/check_servo_pulse.py
    tilt_us_per_deg: 11.111
    pan_invert: false          # +pan must turn the head LEFT
    tilt_invert: true          # +tilt must look UP (flipped: this servo was mounted the other way up)
    servo_speed_dps: 60.0      # head speed, deg/s; lower = slower, below ~10 gets steppy
    servo_fast_dps: 120.0      # the most a move may ask for: follow's search sweep. Still ramped (accelerates
                               # and slows down), so not a snap; set it to servo_speed_dps to keep every move slow
    servo_min_us: 500.0        # hard pulse window: no angle or trim can send a pulse outside it. The driver
    servo_max_us: 2500.0       # shrinks the reachable angles to fit: with pan centred at 1600 us, 2500 lets it
                               # reach +81 deg to the left (2400 stopped it at +72; -90 right is at 600 us).
                               # If the servo buzzes at full left, it is against its stop: back to 2400.
                               # Full +-90: re-fit the pan horn one tooth so straight ahead is near 1500 us
    hold_on_close: true        # on shutdown park at centre and KEEP holding it (false: release the PWM, servos go limp)
    servo_power_gpio: 4        # BCM pin that reads the servo +5 V through a 10k/20k divider (high = on); 0 = none fitted.
                               # While it reads low the head is frozen and moves are refused, so switching the servos on
                               # can never snap them to a stale position

/display:
  ros__parameters:
    buzzer_pin: 26             # BCM pin of the passive buzzer (README "Buzzer"); 0 = none fitted, no sounds.
                               # Never 12, 13, 18 or 19: those are the head servos' PWM channels
