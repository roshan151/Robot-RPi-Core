<svg viewBox="0 0 1100 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Tank bot star-ground wiring (fixed)</title>
  <desc>LiPo feeds a buck converter; from the buck's negative output (star point) each ground runs its own spoke: two thick spokes to the DRV8871 drivers, one thin spoke to the Arduino. No ground ring.</desc>
  <rect width="1100" height="760" fill="#ffffff"/>

  <text x="550" y="30" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">Tank bot power wiring — star ground (fixed)</text>

  <!-- Legend -->
  <line x1="50" y1="62" x2="82" y2="62" stroke="#c62828" stroke-width="2.5"/>
  <text x="90" y="66" font-size="12" fill="#424242">power (buck out, set 8–9 V)</text>
  <line x1="50" y1="84" x2="82" y2="84" stroke="#212121" stroke-width="4"/>
  <text x="90" y="88" font-size="12" fill="#424242">ground spoke (each = its own wire)</text>
  <line x1="50" y1="106" x2="82" y2="106" stroke="#1565c0" stroke-width="2"/>
  <text x="90" y="110" font-size="12" fill="#424242">logic signal</text>

  <!-- Battery -->
  <rect x="40" y="140" width="120" height="100" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <text x="100" y="185" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">LiPo 3S</text>
  <text x="100" y="205" font-size="12" fill="#424242" text-anchor="middle">11.1 V</text>
  <text x="168" y="158" font-size="13" font-weight="bold" fill="#c62828">+</text>
  <text x="168" y="245" font-size="13" font-weight="bold" fill="#212121">−</text>
  <line x1="160" y1="165" x2="240" y2="165" stroke="#c62828" stroke-width="2.5"/>
  <line x1="160" y1="225" x2="240" y2="225" stroke="#212121" stroke-width="2.5"/>

  <!-- Buck -->
  <rect x="240" y="130" width="160" height="120" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <text x="320" y="180" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">BUCK</text>
  <text x="320" y="198" font-size="11" fill="#424242" text-anchor="middle">output set to 8–9 V</text>
  <text x="248" y="169" font-size="10" fill="#757575">IN+</text>
  <text x="248" y="229" font-size="10" fill="#757575">IN−</text>
  <text x="392" y="169" font-size="10" fill="#757575" text-anchor="end">OUT+</text>
  <text x="392" y="229" font-size="10" fill="#757575" text-anchor="end">OUT−</text>
  <text x="320" y="272" font-size="11" font-style="italic" fill="#757575" text-anchor="middle">add 100 nF + 470 µF at each driver's VM/GND too</text>

  <!-- +V rail -->
  <line x1="400" y1="165" x2="540" y2="165" stroke="#c62828" stroke-width="2.5"/>
  <line x1="540" y1="80" x2="540" y2="285" stroke="#c62828" stroke-width="2.5"/>
  <line x1="540" y1="80" x2="660" y2="80" stroke="#c62828" stroke-width="2.5"/>
  <line x1="540" y1="285" x2="660" y2="285" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="540" cy="165" r="3.5" fill="#c62828"/>
  <text x="600" y="70" font-size="11" font-style="italic" fill="#757575" text-anchor="middle">twist each VM+GND pair</text>

  <!-- Bulk cap -->
  <line x1="450" y1="165" x2="450" y2="186" stroke="#212121" stroke-width="2"/>
  <line x1="438" y1="186" x2="462" y2="186" stroke="#212121" stroke-width="2.5"/>
  <line x1="438" y1="196" x2="462" y2="196" stroke="#212121" stroke-width="2.5"/>
  <line x1="450" y1="196" x2="450" y2="225" stroke="#212121" stroke-width="2"/>
  <text x="430" y="184" font-size="11" font-weight="bold" fill="#c62828">+</text>
  <text x="470" y="195" font-size="11" fill="#424242">1000 µF</text>
  <circle cx="450" cy="165" r="3.5" fill="#c62828"/>
  <circle cx="450" cy="225" r="3.5" fill="#212121"/>

  <!-- OUT− feed to star -->
  <line x1="400" y1="225" x2="480" y2="225" stroke="#212121" stroke-width="2.5"/>
  <line x1="480" y1="225" x2="480" y2="460" stroke="#212121" stroke-width="2.5"/>

  <!-- Star point -->
  <circle cx="480" cy="460" r="6" fill="#212121"/>
  <text x="468" y="466" font-size="13" font-weight="bold" fill="#212121" text-anchor="end">STAR POINT</text>
  <text x="468" y="482" font-size="11" fill="#757575" text-anchor="end">(= buck OUT− terminal)</text>
  <text x="468" y="498" font-size="11" fill="#757575" text-anchor="end">all grounds join ONLY here</text>

  <!-- Ground spokes -->
  <polyline points="480,460 580,440 580,160 660,160" fill="none" stroke="#212121" stroke-width="4"/>
  <polyline points="480,460 620,445 620,365 660,365" fill="none" stroke="#212121" stroke-width="4"/>
  <polyline points="480,460 480,560 560,560" fill="none" stroke="#212121" stroke-width="2"/>
  <text x="596" y="478" font-size="11" font-style="italic" fill="#757575">driver GND spokes — short &amp; direct (22 AWG OK)</text>

  <!-- DRV1 LEFT -->
  <rect x="660" y="55" width="150" height="130" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <text x="735" y="100" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">DRV8871</text>
  <text x="735" y="118" font-size="12" fill="#424242" text-anchor="middle">#1 — LEFT</text>
  <text x="668" y="84" font-size="10" fill="#757575">VM</text>
  <text x="668" y="164" font-size="10" fill="#757575">GND</text>
  <text x="802" y="81" font-size="10" fill="#757575" text-anchor="end">OUT1</text>
  <text x="802" y="139" font-size="10" fill="#757575" text-anchor="end">OUT2</text>
  <text x="700" y="178" font-size="10" fill="#757575" text-anchor="middle">IN1</text>
  <text x="750" y="178" font-size="10" fill="#757575" text-anchor="middle">IN2</text>
  <line x1="700" y1="185" x2="700" y2="212" stroke="#1565c0" stroke-width="2"/>
  <line x1="750" y1="185" x2="750" y2="212" stroke="#1565c0" stroke-width="2"/>
  <text x="700" y="228" font-size="11" fill="#1565c0" text-anchor="middle">← D5</text>
  <text x="750" y="228" font-size="11" fill="#1565c0" text-anchor="middle">← D6</text>
  <line x1="810" y1="85" x2="880" y2="85" stroke="#616161" stroke-width="2.5"/>
  <line x1="810" y1="125" x2="880" y2="125" stroke="#616161" stroke-width="2.5"/>
  <rect x="880" y="50" width="110" height="85" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <text x="935" y="90" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">MOTOR</text>
  <text x="935" y="108" font-size="12" fill="#424242" text-anchor="middle">LEFT</text>

  <!-- DRV2 RIGHT -->
  <rect x="660" y="260" width="150" height="130" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <text x="735" y="305" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">DRV8871</text>
  <text x="735" y="323" font-size="12" fill="#424242" text-anchor="middle">#2 — RIGHT</text>
  <text x="668" y="289" font-size="10" fill="#757575">VM</text>
  <text x="668" y="369" font-size="10" fill="#757575">GND</text>
  <text x="802" y="286" font-size="10" fill="#757575" text-anchor="end">OUT1</text>
  <text x="802" y="344" font-size="10" fill="#757575" text-anchor="end">OUT2</text>
  <text x="700" y="384" font-size="10" fill="#757575" text-anchor="middle">IN1</text>
  <text x="750" y="384" font-size="10" fill="#757575" text-anchor="middle">IN2</text>
  <line x1="700" y1="390" x2="700" y2="417" stroke="#1565c0" stroke-width="2"/>
  <line x1="750" y1="390" x2="750" y2="417" stroke="#1565c0" stroke-width="2"/>
  <text x="700" y="433" font-size="11" fill="#1565c0" text-anchor="middle">← D9</text>
  <text x="750" y="433" font-size="11" fill="#1565c0" text-anchor="middle">← D10</text>
  <line x1="810" y1="290" x2="880" y2="290" stroke="#616161" stroke-width="2.5"/>
  <line x1="810" y1="330" x2="880" y2="330" stroke="#616161" stroke-width="2.5"/>
  <rect x="880" y="255" width="110" height="85" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <text x="935" y="295" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle">MOTOR</text>
  <text x="935" y="313" font-size="12" fill="#424242" text-anchor="middle">RIGHT</text>

  <!-- Arduino -->
  <rect x="560" y="520" width="300" height="170" fill="#fafafa" stroke="#424242" stroke-width="1.5"/>
  <line x1="620" y1="500" x2="620" y2="520" stroke="#1565c0" stroke-width="2"/>
  <line x1="660" y1="500" x2="660" y2="520" stroke="#1565c0" stroke-width="2"/>
  <line x1="740" y1="500" x2="740" y2="520" stroke="#1565c0" stroke-width="2"/>
  <line x1="780" y1="500" x2="780" y2="520" stroke="#1565c0" stroke-width="2"/>
  <text x="620" y="494" font-size="11" fill="#1565c0" text-anchor="middle">D5</text>
  <text x="660" y="494" font-size="11" fill="#1565c0" text-anchor="middle">D6</text>
  <text x="740" y="494" font-size="11" fill="#1565c0" text-anchor="middle">D9</text>
  <text x="780" y="494" font-size="11" fill="#1565c0" text-anchor="middle">D10</text>
  <text x="568" y="556" font-size="10" fill="#757575">GND</text>
  <text x="710" y="552" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle">ARDUINO UNO</text>
  <text x="710" y="578" font-size="11" fill="#1565c0" text-anchor="middle">D5·D6 → LEFT IN1·IN2</text>
  <text x="710" y="595" font-size="11" fill="#1565c0" text-anchor="middle">D9·D10 → RIGHT IN1·IN2</text>
  <text x="710" y="618" font-size="11" fill="#757575" text-anchor="middle">D2·D3 ← encoders (5 V &amp; GND from Arduino only)</text>
  <text x="710" y="638" font-size="11" fill="#757575" text-anchor="middle">GND → star (one thin wire, its only ground)</text>
  <line x1="860" y1="660" x2="930" y2="660" stroke="#616161" stroke-width="2"/>
  <text x="936" y="664" font-size="11" fill="#424242">USB → Mac</text>

  <!-- Rule -->
  <text x="550" y="730" font-size="12" font-weight="bold" fill="#212121" text-anchor="middle">RULE: every ground joins ONLY at the star — no ring, no second path.</text>
  <text x="550" y="748" font-size="11" fill="#757575" text-anchor="middle">Cut test: cutting any single ground wire must leave something disconnected. If nothing loses ground, you've built a loop.</text>
</svg>
